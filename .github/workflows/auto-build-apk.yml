name: Auto Build APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Generate Project Files & Auto-Captions App Code
        run: |
          mkdir -p app/src/main/java/com/example/capcutclone
          mkdir -p app/src/main/res/values

          cat << 'EOF' > settings.gradle.kts
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "CapCutClone"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle.kts
          plugins {
              id("com.android.application") version "8.5.0" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF

          cat << 'EOF' > gradle.properties
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          cat << 'EOF' > app/build.gradle.kts
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
          }

          android {
              namespace = "com.example.capcutclone"
              compileSdk = 34

              defaultConfig {
                  applicationId = "com.example.capcutclone"
                  minSdk = 26
                  targetSdk = 34
                  versionCode = 1
                  versionName = "1.0"
              }

              buildFeatures {
                  compose = true
              }

              composeOptions {
                  kotlinCompilerExtensionVersion = "1.5.14"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.06.00"))
              implementation("androidx.core:core-ktx:1.13.1")
              implementation("androidx.activity:activity-compose:1.9.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.media3:media3-exoplayer:1.3.1")
              implementation("androidx.media3:media3-ui:1.3.1")
          }
          EOF

          cat << 'EOF' > app/src/main/AndroidManifest.xml
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application
                  android:label="CapCut Clone"
                  android:theme="@android:style/Theme.Material.NoActionBar">
                  <activity
                      android:name=".MainActivity"
                      android:exported="true">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF

          cat << 'EOF' > app/src/main/java/com/example/capcutclone/MainActivity.kt
          package com.example.capcutclone

          import android.net.Uri
          import android.os.Bundle
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.rememberLauncherForActivityResult
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.background
          import androidx.compose.foundation.clickable
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.lazy.LazyColumn
          import androidx.compose.foundation.lazy.itemsIndexed
          import androidx.compose.foundation.shape.RoundedCornerShape
          import androidx.compose.material.icons.Icons
          import androidx.compose.material.icons.filled.Add
          import androidx.compose.material.icons.filled.Close
          import androidx.compose.material.icons.filled.PlayArrow
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.draw.clip
          import androidx.compose.ui.graphics.Color
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.text.font.FontWeight
          import androidx.compose.ui.text.style.TextAlign
          import androidx.compose.ui.unit.dp
          import androidx.compose.ui.unit.sp
          import androidx.compose.ui.viewinterop.AndroidView
          import androidx.media3.common.MediaItem
          import androidx.media3.exoplayer.ExoPlayer
          import androidx.media3.ui.PlayerView
          import kotlinx.coroutines.delay

          data class CaptionSegment(
              val startMs: Long,
              val endMs: Long,
              val text: String
          )

          class MainActivity : ComponentActivity() {
              override fun onCreate(savedInstanceState: Bundle?) {
                  super.onCreate(savedInstanceState)
                  setContent {
                      MaterialTheme(colorScheme = darkColorScheme()) {
                          CapCutCloneScreen()
                      }
                  }
              }
          }

          @Composable
          fun CapCutCloneScreen() {
              val context = LocalContext.current
              var videoUri by remember { mutableStateOf<Uri?>(null) }
              var isPlaying by remember { mutableStateOf(false) }
              var currentPositionMs by remember { mutableLongStateOf(0L) }
              var durationMs by remember { mutableLongStateOf(1L) }
              var captionHighlightColor by remember { mutableStateOf(Color(0xFFFFD600)) }
              val captions = remember { mutableStateListOf<CaptionSegment>() }

              val exoPlayer = remember {
                  ExoPlayer.Builder(context).build()
              }

              DisposableEffect(Unit) {
                  onDispose { exoPlayer.release() }
              }

              val videoPicker = rememberLauncherForActivityResult(
                  contract = ActivityResultContracts.GetContent()
              ) { uri: Uri? ->
                  videoUri = uri
                  if (uri != null) {
                      exoPlayer.setMediaItem(MediaItem.fromUri(uri))
                      exoPlayer.prepare()
                  }
              }

              LaunchedEffect(isPlaying) {
                  while (isPlaying) {
                      currentPositionMs = exoPlayer.currentPosition
                      durationMs = exoPlayer.duration.coerceAtLeast(1L)
                      delay(50L)
                  }
              }

              Column(
                  modifier = Modifier
                      .fillMaxSize()
                      .background(Color(0xFF121212))
                      .padding(16.dp)
              ) {
                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.SpaceBetween,
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      Text(
                          text = "CapCut Clone",
                          color = Color.White,
                          fontSize = 20.sp,
                          fontWeight = FontWeight.Bold
                      )
                      Button(
                          onClick = { videoPicker.launch("video/*") },
                          colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF))
                      ) {
                          Text("Import Video", color = Color.Black, fontWeight = FontWeight.Bold)
                      }
                  }

                  Spacer(Modifier.height(10.dp))

                  Box(
                      modifier = Modifier
                          .fillMaxWidth()
                          .weight(1f)
                          .clip(RoundedCornerShape(12.dp))
                          .background(Color.Black),
                      contentAlignment = Alignment.Center
                  ) {
                      if (videoUri != null) {
                          AndroidView(
                              factory = { ctx ->
                                  PlayerView(ctx).apply {
                                      player = exoPlayer
                                      useController = false
                                  }
                              },
                              modifier = Modifier.fillMaxSize()
                          )
                      } else {
                          Text("Import a video to begin editing", color = Color.Gray)
                      }

                      val activeCaption = captions.firstOrNull {
                          currentPositionMs in it.startMs..it.endMs
                      }
                      if (activeCaption != null) {
                          Text(
                              text = activeCaption.text,
                              color = captionHighlightColor,
                              fontSize = 22.sp,
                              fontWeight = FontWeight.ExtraBold,
                              textAlign = TextAlign.Center,
                              modifier = Modifier
                                  .align(Alignment.BottomCenter)
                                  .padding(24.dp)
                                  .background(Color(0xAA000000), RoundedCornerShape(8.dp))
                                  .padding(horizontal = 12.dp, vertical = 6.dp)
                          )
                      }
                  }

                  Spacer(Modifier.height(8.dp))

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      verticalAlignment = Alignment.CenterVertically
                  ) {
                      IconButton(
                          onClick = {
                              if (exoPlayer.isPlaying) {
                                  exoPlayer.pause()
                                  isPlaying = false
                              } else {
                                  exoPlayer.play()
                                  isPlaying = true
                              }
                          }
                      ) {
                          Icon(
                              imageVector = if (isPlaying) Icons.Default.Close else Icons.Default.PlayArrow,
                              contentDescription = "Play/Pause",
                              tint = Color.White
                          )
                      }

                      Slider(
                          value = currentPositionMs.toFloat(),
                          onValueChange = {
                              currentPositionMs = it.toLong()
                              if (videoUri != null) exoPlayer.seekTo(currentPositionMs)
                          },
                          valueRange = 0f..durationMs.coerceAtLeast(1L).toFloat(),
                          modifier = Modifier.weight(1f)
                      )
                  }

                  Row(
                      modifier = Modifier.fillMaxWidth(),
                      horizontalArrangement = Arrangement.spacedBy(8.dp)
                  ) {
                      OutlinedButton(
                          onClick = {
                              val start = currentPositionMs
                              val end = (start + 2500L).coerceAtMost(durationMs)
                              captions.add(CaptionSegment(start, end, "New Caption"))
                          }
                      ) {
                          Icon(Icons.Default.Add, contentDescription = null, tint = Color.White)
                          Spacer(Modifier.width(4.dp))
                          Text("Add Line", color = Color.White)
                      }

                      OutlinedButton(
                          onClick = {
                              captionHighlightColor = if (captionHighlightColor == Color(0xFFFFD600)) {
                                  Color(0xFF00E5FF)
                              } else {
                                  Color(0xFFFFD600)
                              }
                          }
                      ) {
                          Text("Style", color = captionHighlightColor)
                      }
                  }

                  Spacer(Modifier.height(8.dp))

                  LazyColumn(
                      modifier = Modifier
                          .fillMaxWidth()
                          .height(170.dp),
                      verticalArrangement = Arrangement.spacedBy(6.dp)
                  ) {
                      itemsIndexed(captions) { index, item ->
                          Row(
                              modifier = Modifier
                                  .fillMaxWidth()
                                  .background(Color(0xFF242429), RoundedCornerShape(8.dp))
                                  .clickable {
                                      currentPositionMs = item.startMs
                                      if (videoUri != null) exoPlayer.seekTo(item.startMs)
                                  }
                                  .padding(8.dp),
                              verticalAlignment = Alignment.CenterVertically
                          ) {
                              Text(
                                  text = String.format("%.1fs", item.startMs / 1000f),
                                  color = Color(0xFF00E5FF),
                                  fontSize = 12.sp,
                                  modifier = Modifier.width(44.dp)
                              )
                              OutlinedTextField(
                                  value = item.text,
                                  onValueChange = { updated ->
                                      captions[index] = item.copy(text = updated)
                                  },
                                  singleLine = true,
                                  modifier = Modifier.weight(1f),
                                  colors = OutlinedTextFieldDefaults.colors(
                                      focusedTextColor = Color.White,
                                      unfocusedTextColor = Color.White
                                  )
                              )
                          }
                      }
                  }
              }
          }
          EOF

      - name: Build Debug APK
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: capcut-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          
