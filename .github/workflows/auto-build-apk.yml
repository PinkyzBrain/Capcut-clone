name: Build CapCut APK & Save Project Files

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Project Files (only if not saved in repo yet)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            mkdir -p app/src/main/java/com/example/capcutclone

            cat << 'EOF' > settings.gradle.kts
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "CapCutClone"
            include(":app")
            EOF

            cat << 'EOF' > build.gradle.kts
            plugins {
                id("com.android.application") version "8.7.3" apply false
                id("org.jetbrains.kotlin.android") version "2.1.0" apply false
                id("org.jetbrains.kotlin.plugin.compose") version "2.1.0" apply false
            }
            EOF

            cat << 'EOF' > gradle.properties
            org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
            android.useAndroidX=true
            android.nonTransitiveRClass=true
            EOF

            cat << 'EOF' > app/build.gradle.kts
            plugins {
                id("com.android.application")
                id("org.jetbrains.kotlin.android")
                id("org.jetbrains.kotlin.plugin.compose")
            }

            android {
                namespace = "com.example.capcutclone"
                compileSdk = 35

                defaultConfig {
                    applicationId = "com.example.capcutclone"
                    minSdk = 26
                    targetSdk = 35
                    versionCode = 2
                    versionName = "1.1"
                }

                buildFeatures {
                    compose = true
                }
                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }

            dependencies {
                val media3Version = "1.5.1"

                implementation(platform("androidx.compose:compose-bom:2025.01.00"))
                implementation("androidx.activity:activity-compose:1.10.0")
                implementation("androidx.compose.ui:ui")
                implementation("androidx.compose.material3:material3")
                implementation("androidx.compose.material:material-icons-extended")
                implementation("androidx.lifecycle:lifecycle-viewmodel-compose:2.8.7")

                implementation("androidx.media3:media3-exoplayer:$media3Version")
                implementation("androidx.media3:media3-ui:$media3Version")
                implementation("androidx.media3:media3-common:$media3Version")
                implementation("androidx.media3:media3-transformer:$media3Version")
                implementation("androidx.media3:media3-effect:$media3Version")
            }
            EOF

            cat << 'EOF' > app/src/main/AndroidManifest.xml
            <?xml version="1.0" encoding="utf-8"?>
            <manifest xmlns:android="http://schemas.android.com/apk/res/android">
                <uses-permission android:name="android.permission.RECORD_AUDIO" />
                <application
                    android:allowBackup="true"
                    android:label="CapCut Native"
                    android:supportsRtl="true"
                    android:theme="@android:style/Theme.Material.NoActionBar">
                    <activity
                        android:name=".MainActivity"
                        android:exported="true"
                        android:configChanges="orientation|screenSize|screenLayout|keyboardHidden">
                        <intent-filter>
                            <action android:name="android.intent.action.MAIN" />
                            <category android:name="android.intent.category.LAUNCHER" />
                        </intent-filter>
                    </activity>
                </application>
            </manifest>
            EOF

            cat << 'EOF' > app/src/main/java/com/example/capcutclone/VideoEditorViewModel.kt
            package com.example.capcutclone

            import android.content.Context
            import android.graphics.Color
            import android.graphics.Typeface
            import android.net.Uri
            import android.text.Spannable
            import android.text.SpannableString
            import android.text.style.BackgroundColorSpan
            import android.text.style.ForegroundColorSpan
            import android.text.style.RelativeSizeSpan
            import android.text.style.StyleSpan
            import android.text.style.TypefaceSpan
            import androidx.annotation.OptIn
            import androidx.lifecycle.ViewModel
            import androidx.media3.common.Effect
            import androidx.media3.common.MediaItem
            import androidx.media3.common.PlaybackParameters
            import androidx.media3.common.util.UnstableApi
            import androidx.media3.effect.Contrast
            import androidx.media3.effect.OverlayEffect
            import androidx.media3.effect.OverlaySettings
            import androidx.media3.effect.RgbFilter
            import androidx.media3.effect.ScaleAndRotateTransformation
            import androidx.media3.effect.TextOverlay
            import androidx.media3.effect.TextureOverlay
            import androidx.media3.exoplayer.ExoPlayer
            import androidx.media3.transformer.Composition
            import androidx.media3.transformer.EditedMediaItem
            import androidx.media3.transformer.EditedMediaItemSequence
            import androidx.media3.transformer.Effects
            import androidx.media3.transformer.ExportException
            import androidx.media3.transformer.ExportResult
            import androidx.media3.transformer.Transformer
            import com.google.common.collect.ImmutableList
            import kotlinx.coroutines.flow.MutableStateFlow
            import kotlinx.coroutines.flow.StateFlow
            import kotlinx.coroutines.flow.update
            import java.io.File
            import java.util.UUID

            data class VideoClip(
                val id: String = UUID.randomUUID().toString(),
                val uri: Uri,
                val name: String,
                val startMs: Long = 0L,
                val endMs: Long = 10_000L,
                val speed: Float = 1.0f
            )

            data class CaptionSegment(
                val id: String = UUID.randomUUID().toString(),
                val text: String,
                val startMs: Long,
                val endMs: Long
            )

            enum class CaptionStylePreset(
                val label: String,
                val textColorHex: Int,
                val bgColorHex: Int?,
                val scale: Float,
                val isUppercase: Boolean
            ) {
                HORMOZI("Hormozi Yellow", Color.YELLOW, Color.argb(210, 0, 0, 0), 2.1f, true),
                TIKTOK_BOX("TikTok Box", Color.WHITE, Color.argb(220, 20, 20, 25), 1.7f, false),
                NEON_CYBER("Neon Cyber", Color.CYAN, Color.argb(180, 15, 0, 35), 2.0f, true),
                MRBEAST("MrBeast Pop", Color.WHITE, Color.argb(230, 229, 57, 53), 2.2f, true),
                MINIMAL("Minimal Clean", Color.WHITE, null, 1.6f, false)
            }

            enum class CaptionFontFamily(val label: String, val familyName: String, val styleFlags: Int) {
                SANS_BOLD("Impact Sans", "sans-serif-black", Typeface.BOLD),
                SERIF("Editorial Serif", "serif", Typeface.BOLD_ITALIC),
                MONOSPACE("Cyber Mono", "monospace", Typeface.BOLD),
                CURSIVE("Creator Script", "cursive", Typeface.BOLD)
            }

            enum class FilterPreset(val label: String) {
                NONE("Original"),
                GRAYSCALE("B&W"),
                INVERTED("Inverted"),
                HIGH_CONTRAST("Vivid")
            }

            data class EditorUiState(
                val clips: List<VideoClip> = emptyList(),
                val selectedClipIndex: Int = 0,
                val captions: List<CaptionSegment> = emptyList(),
                val selectedCaptionStyle: CaptionStylePreset = CaptionStylePreset.HORMOZI,
                val selectedCaptionFont: CaptionFontFamily = CaptionFontFamily.SANS_BOLD,
                val captionVerticalY: Float = -0.55f,
                val activeFilter: FilterPreset = FilterPreset.NONE,
                val aspectRatioRotation: Float = 0f,
                val isExporting: Boolean = false,
                val exportMessage: String? = null
            )

            @OptIn(UnstableApi::class)
            class VideoEditorViewModel : ViewModel() {

                private val _uiState = MutableStateFlow(EditorUiState())
                val uiState: StateFlow<EditorUiState> = _uiState

                fun addVideoClip(uri: Uri, durationMs: Long, player: ExoPlayer) {
                    val safeDuration = if (durationMs > 0) durationMs else 8_000L
                    val newClip = VideoClip(
                        uri = uri,
                        name = "Clip ${_uiState.value.clips.size + 1}",
                        startMs = 0L,
                        endMs = safeDuration
                    )
                    _uiState.update { state ->
                        val updated = state.clips + newClip
                        state.copy(clips = updated, selectedClipIndex = updated.lastIndex)
                    }
                    syncPlayerWithTimeline(player)
                }

                fun selectClip(index: Int, player: ExoPlayer) {
                    if (index in _uiState.value.clips.indices) {
                        _uiState.update { it.copy(selectedClipIndex = index) }
                        player.seekTo(index, 0L)
                    }
                }

                fun splitSelectedClipAt(currentPositionMs: Long, player: ExoPlayer) {
                    val state = _uiState.value
                    val idx = state.selectedClipIndex
                    val clip = state.clips.getOrNull(idx) ?: return

                    val splitPoint = (clip.startMs + currentPositionMs).coerceIn(clip.startMs + 500L, clip.endMs - 500L)
                    if (splitPoint <= clip.startMs + 500L || splitPoint >= clip.endMs - 500L) return

                    val firstHalf = clip.copy(id = UUID.randomUUID().toString(), endMs = splitPoint)
                    val secondHalf = clip.copy(id = UUID.randomUUID().toString(), startMs = splitPoint)

                    val mutable = state.clips.toMutableList()
                    mutable[idx] = firstHalf
                    mutable.add(idx + 1, secondHalf)

                    _uiState.update { it.copy(clips = mutable, selectedClipIndex = idx + 1) }
                    syncPlayerWithTimeline(player)
                }

                fun trimSelectedClip(newStartMs: Long, newEndMs: Long, player: ExoPlayer) {
                    val state = _uiState.value
                    val idx = state.selectedClipIndex
                    val clip = state.clips.getOrNull(idx) ?: return

                    if (newEndMs - newStartMs < 500L) return
                    val updatedClip = clip.copy(startMs = newStartMs, endMs = newEndMs)
                    val mutable = state.clips.toMutableList().apply { this[idx] = updatedClip }

                    _uiState.update { it.copy(clips = mutable) }
                    syncPlayerWithTimeline(player)
                }

                fun setPlaybackSpeed(speed: Float, player: ExoPlayer) {
                    val state = _uiState.value
                    val idx = state.selectedClipIndex
                    val clip = state.clips.getOrNull(idx) ?: return

                    val mutable = state.clips.toMutableList().apply { this[idx] = clip.copy(speed = speed) }
                    _uiState.update { it.copy(clips = mutable) }
                    player.playbackParameters = PlaybackParameters(speed)
                }

                fun deleteSelectedClip(player: ExoPlayer) {
                    val state = _uiState.value
                    if (state.clips.isEmpty()) return
                    val mutable = state.clips.toMutableList().apply { removeAt(state.selectedClipIndex) }
                    val nextIndex = (state.selectedClipIndex - 1).coerceAtLeast(0)
                    _uiState.update { it.copy(clips = mutable, selectedClipIndex = nextIndex) }
                    syncPlayerWithTimeline(player)
                }

                fun generateSmartAutoCaptions(rawTranscript: String?, player: ExoPlayer) {
                    val totalDurationMs = _uiState.value.clips.sumOf { (it.endMs - it.startMs).coerceAtLeast(1000L) }
                        .coerceAtLeast(6_000L)

                    val lines = if (!rawTranscript.isNullOrBlank()) {
                        rawTranscript.trim().split(Regex("\\s+"))
                            .chunked(3)
                            .map { it.joinToString(" ") }
                    } else {
                        listOf(
                            "Wait for the drop...",
                            "Edited natively on Android",
                            "Zero computer needed!",
                            "Full OpenGL Auto-Captions"
                        )
                    }

                    val sliceMs = (totalDurationMs / lines.size).coerceAtLeast(1200L)
                    val generated = lines.mapIndexed { idx, line ->
                        CaptionSegment(
                            text = line,
                            startMs = idx * sliceMs,
                            endMs = ((idx + 1) * sliceMs) - 100L
                        )
                    }

                    _uiState.update { it.copy(captions = generated) }
                    applyEffectsToPlayer(player)
                }

                fun updateCaptionStyle(style: CaptionStylePreset, player: ExoPlayer) {
                    _uiState.update { it.copy(selectedCaptionStyle = style) }
                    applyEffectsToPlayer(player)
                }

                fun updateCaptionFont(font: CaptionFontFamily, player: ExoPlayer) {
                    _uiState.update { it.copy(selectedCaptionFont = font) }
                    applyEffectsToPlayer(player)
                }

                fun cycleCaptionPosition(player: ExoPlayer) {
                    val nextY = when (_uiState.value.captionVerticalY) {
                        -0.55f -> 0.0f
                        0.0f -> 0.55f
                        else -> -0.55f
                    }
                    _uiState.update { it.copy(captionVerticalY = nextY) }
                    applyEffectsToPlayer(player)
                }

                fun clearCaptions(player: ExoPlayer) {
                    _uiState.update { it.copy(captions = emptyList()) }
                    applyEffectsToPlayer(player)
                }

                fun setFilter(filter: FilterPreset, player: ExoPlayer) {
                    _uiState.update { it.copy(activeFilter = filter) }
                    applyEffectsToPlayer(player)
                }

                fun rotateVideo(player: ExoPlayer) {
                    _uiState.update { it.copy(aspectRatioRotation = (it.aspectRatioRotation + 90f) % 360f) }
                    applyEffectsToPlayer(player)
                }

                private fun syncPlayerWithTimeline(player: ExoPlayer) {
                    val mediaItems = _uiState.value.clips.map { clip ->
                        MediaItem.Builder()
                            .setUri(clip.uri)
                            .setClippingConfiguration(
                                MediaItem.ClippingConfiguration.Builder()
                                    .setStartPositionMs(clip.startMs)
                                    .setEndPositionMs(clip.endMs)
                                    .build()
                            )
                            .build()
                    }
                    player.setMediaItems(mediaItems)
                    applyEffectsToPlayer(player)
                    player.prepare()
                }

                private fun buildStyledSpannable(rawText: String, style: CaptionStylePreset, font: CaptionFontFamily): SpannableString {
                    val formatted = if (style.isUppercase) " ${rawText.uppercase()} " else " $rawText "
                    return SpannableString(formatted).apply {
                        setSpan(ForegroundColorSpan(style.textColorHex), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                        style.bgColorHex?.let { bg ->
                            setSpan(BackgroundColorSpan(bg), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                        }
                        setSpan(RelativeSizeSpan(style.scale), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                        setSpan(TypefaceSpan(font.familyName), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                        setSpan(StyleSpan(font.styleFlags), 0, length, Spannable.SPAN_EXCLUSIVE_EXCLUSIVE)
                    }
                }

                private fun buildVideoEffects(): List<Effect> {
                    val state = _uiState.value
                    val effects = mutableListOf<Effect>()

                    when (state.activeFilter) {
                        FilterPreset.GRAYSCALE -> effects.add(RgbFilter.createGrayscaleFilter())
                        FilterPreset.INVERTED -> effects.add(RgbFilter.createInvertedFilter())
                        FilterPreset.HIGH_CONTRAST -> effects.add(Contrast(0.35f))
                        FilterPreset.NONE -> Unit
                    }

                    if (state.aspectRatioRotation != 0f) {
                        effects.add(
                            ScaleAndRotateTransformation.Builder()
                                .setRotationDegrees(state.aspectRatioRotation)
                                .build()
                        )
                    }

                    if (state.captions.isNotEmpty()) {
                        val style = state.selectedCaptionStyle
                        val font = state.selectedCaptionFont
                        val yAnchor = state.captionVerticalY

                        val timedTextOverlay = object : TextOverlay() {
                            override fun getText(presentationTimeUs: Long): SpannableString {
                                val currentMs = presentationTimeUs / 1000L
                                val activeSeg = state.captions.firstOrNull {
                                    currentMs in it.startMs..it.endMs
                                }
                                return if (activeSeg != null) {
                                    buildStyledSpannable(activeSeg.text, style, font)
                                } else {
                                    SpannableString("")
                                }
                            }

                            override fun getOverlaySettings(presentationTimeUs: Long): OverlaySettings {
                                return OverlaySettings.Builder()
                                    .setBackgroundFrameAnchor(0f, yAnchor)
                                    .build()
                            }
                        }

                        effects.add(OverlayEffect(ImmutableList.of<TextureOverlay>(timedTextOverlay)))
                    }

                    return effects
                }

                private fun applyEffectsToPlayer(player: ExoPlayer) {
                    player.setVideoEffects(buildVideoEffects())
                }

                fun exportProjectToMp4(context: Context) {
                    val state = _uiState.value
                    if (state.clips.isEmpty() || state.isExporting) return

                    _uiState.update { it.copy(isExporting = true, exportMessage = "Burning Captions & Rendering MP4...") }

                    val outputFile = File(
                        context.getExternalFilesDir(null),
                        "CapCut_Export_${System.currentTimeMillis()}.mp4"
                    )

                    val videoEffects = buildVideoEffects()

                    val editedItems = state.clips.map { clip ->
                        val mediaItem = MediaItem.Builder()
                            .setUri(clip.uri)
                            .setClippingConfiguration(
                                MediaItem.ClippingConfiguration.Builder()
                                    .setStartPositionMs(clip.startMs)
                                    .setEndPositionMs(clip.endMs)
                                    .build()
                            )
                            .build()

                        EditedMediaItem.Builder(mediaItem)
                            .setEffects(Effects(emptyList(), videoEffects))
                            .build()
                    }

                    val sequence = EditedMediaItemSequence(editedItems)
                    val composition = Composition.Builder(listOf(sequence)).build()

                    val transformer = Transformer.Builder(context)
                        .addListener(object : Transformer.Listener {
                            override fun onCompleted(composition: Composition, exportResult: ExportResult) {
                                _uiState.update {
                                    it.copy(
                                        isExporting = false,
                                        exportMessage = "Saved MP4 with Captions: ${outputFile.name}"
                                    )
                                }
                            }

                            override fun onError(
                                composition: Composition,
                                exportResult: ExportResult,
                                exportException: ExportException
                            ) {
                                _uiState.update {
                                    it.copy(
                                        isExporting = false,
                                        exportMessage = "Export Failed: ${exportException.localizedMessage}"
                                    )
                                }
                            }
                        })
                        .build()

                    transformer.start(composition, outputFile.absolutePath)
                }
            }
            EOF

            cat << 'EOF' > app/src/main/java/com/example/capcutclone/MainActivity.kt
            package com.example.capcutclone

            import android.app.Activity
            import android.content.Intent
            import android.media.MediaMetadataRetriever
            import android.net.Uri
            import android.os.Bundle
            import android.speech.RecognizerIntent
            import androidx.activity.ComponentActivity
            import androidx.activity.compose.rememberLauncherForActivityResult
            import androidx.activity.compose.setContent
            import androidx.activity.result.PickVisualMediaRequest
            import androidx.activity.result.contract.ActivityResultContracts
            import androidx.compose.foundation.background
            import androidx.compose.foundation.border
            import androidx.compose.foundation.clickable
            import androidx.compose.foundation.horizontalScroll
            import androidx.compose.foundation.layout.*
            import androidx.compose.foundation.rememberScrollState
            import androidx.compose.foundation.shape.RoundedCornerShape
            import androidx.compose.material.icons.Icons
            import androidx.compose.material.icons.filled.*
            import androidx.compose.material3.*
            import androidx.compose.runtime.*
            import androidx.compose.ui.Alignment
            import androidx.compose.ui.Modifier
            import androidx.compose.ui.draw.clip
            import androidx.compose.ui.graphics.Color
            import androidx.compose.ui.platform.LocalContext
            import androidx.compose.ui.text.font.FontFamily
            import androidx.compose.ui.text.font.FontWeight
            import androidx.compose.ui.unit.dp
            import androidx.compose.ui.unit.sp
            import androidx.compose.ui.viewinterop.AndroidView
            import androidx.lifecycle.viewmodel.compose.viewModel
            import androidx.media3.exoplayer.ExoPlayer
            import androidx.media3.ui.PlayerView
            import kotlinx.coroutines.delay
            import java.util.Locale

            class MainActivity : ComponentActivity() {
                override fun onCreate(savedInstanceState: Bundle?) {
                    super.onCreate(savedInstanceState)
                    setContent {
                        MaterialTheme(colorScheme = darkColorScheme()) {
                            CapCutEditorScreen()
                        }
                    }
                }
            }

            @OptIn(ExperimentalMaterial3Api::class)
            @Composable
            fun CapCutEditorScreen(viewModel: VideoEditorViewModel = viewModel()) {
                val context = LocalContext.current
                val uiState by viewModel.uiState.collectAsState()

                val exoPlayer = remember { ExoPlayer.Builder(context).build() }

                var isPlaying by remember { mutableStateOf(false) }
                var currentPosMs by remember { mutableLongStateOf(0L) }
                var showCaptionsSheet by remember { mutableStateOf(false) }
                var customTranscriptInput by remember { mutableStateOf("") }

                LaunchedEffect(isPlaying) {
                    while (isPlaying) {
                        currentPosMs = exoPlayer.currentPosition
                        delay(33L)
                    }
                }

                DisposableEffect(Unit) {
                    onDispose { exoPlayer.release() }
                }

                val videoPicker = rememberLauncherForActivityResult(
                    contract = ActivityResultContracts.PickVisualMedia()
                ) { uri: Uri? ->
                    uri?.let {
                        val retriever = MediaMetadataRetriever()
                        val duration = try {
                            retriever.setDataSource(context, it)
                            retriever.extractMetadata(MediaMetadataRetriever.METADATA_KEY_DURATION)?.toLong() ?: 8000L
                        } catch (e: Exception) {
                            8000L
                        } finally {
                            retriever.release()
                        }
                        viewModel.addVideoClip(it, duration, exoPlayer)
                    }
                }

                val voiceCaptionLauncher = rememberLauncherForActivityResult(
                    contract = ActivityResultContracts.StartActivityForResult()
                ) { result ->
                    if (result.resultCode == Activity.RESULT_OK) {
                        val spokenText = result.data
                            ?.getStringArrayListExtra(RecognizerIntent.EXTRA_RESULTS)
                            ?.firstOrNull()
                        if (!spokenText.isNullOrBlank()) {
                            customTranscriptInput = spokenText
                            viewModel.generateSmartAutoCaptions(spokenText, exoPlayer)
                        }
                    }
                }

                Column(
                    modifier = Modifier
                        .fillMaxSize()
                        .background(Color(0xFF0E0E10))
                        .systemBarsPadding()
                ) {
                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .padding(horizontal = 16.dp, vertical = 10.dp),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Column {
                            Text(
                                text = "CapCut Native v1.1",
                                color = Color.White,
                                fontWeight = FontWeight.Bold,
                                fontSize = 17.sp
                            )
                            Text(
                                text = "${uiState.selectedCaptionStyle.label} • ${uiState.selectedCaptionFont.label}",
                                color = Color(0xFF00E5FF),
                                fontSize = 11.sp
                            )
                        }

                        Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                            OutlinedButton(
                                onClick = {
                                    videoPicker.launch(
                                        PickVisualMediaRequest(ActivityResultContracts.PickVisualMedia.VideoOnly)
                                    )
                                }
                            ) {
                                Icon(Icons.Default.Add, contentDescription = null, modifier = Modifier.size(18.dp))
                                Spacer(Modifier.width(4.dp))
                                Text("Add Clip")
                            }

                            Button(
                                onClick = { viewModel.exportProjectToMp4(context) },
                                enabled = uiState.clips.isNotEmpty() && !uiState.isExporting,
                                colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF))
                            ) {
                                Text(
                                    if (uiState.isExporting) "Rendering..." else "Export MP4",
                                    color = Color.Black,
                                    fontWeight = FontWeight.Bold
                                )
                            }
                        }
                    }

                    uiState.exportMessage?.let { msg ->
                        Text(
                            text = msg,
                            color = Color(0xFF00E5FF),
                            fontSize = 12.sp,
                            modifier = Modifier.padding(horizontal = 16.dp, vertical = 2.dp)
                        )
                    }

                    Box(
                        modifier = Modifier
                            .fillMaxWidth()
                            .weight(1f)
                            .background(Color.Black),
                        contentAlignment = Alignment.Center
                    ) {
                        if (uiState.clips.isEmpty()) {
                            Text("Tap '+ Add Clip' to import video from your phone", color = Color.Gray)
                        } else {
                            AndroidView(
                                factory = { ctx ->
                                    PlayerView(ctx).apply {
                                        player = exoPlayer
                                        useController = false
                                    }
                                },
                                modifier = Modifier.fillMaxSize()
                            )
                        }
                    }

                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .background(Color(0xFF16161A))
                            .padding(horizontal = 16.dp, vertical = 6.dp),
                        horizontalArrangement = Arrangement.SpaceBetween,
                        verticalAlignment = Alignment.CenterVertically
                    ) {
                        Text("${currentPosMs / 1000f}s", color = Color.LightGray, fontSize = 13.sp)

                        IconButton(
                            onClick = {
                                if (exoPlayer.isPlaying) {
                                    exoPlayer.pause()
                                    isPlaying = false
                                } else {
                                    exoPlayer.play()
                                    isPlaying = true
                                }
                            }
                        ) {
                            Icon(
                                imageVector = if (isPlaying) Icons.Default.Pause else Icons.Default.PlayArrow,
                                contentDescription = "Play/Pause",
                                tint = Color.White,
                                modifier = Modifier.size(32.dp)
                            )
                        }

                        Text("Captions: ${uiState.captions.size}", color = Color(0xFF00E5FF), fontSize = 13.sp)
                    }

                    Column(
                        modifier = Modifier
                            .fillMaxWidth()
                            .height(195.dp)
                            .background(Color(0xFF121216))
                            .padding(horizontal = 12.dp, vertical = 8.dp)
                    ) {
                        if (uiState.captions.isNotEmpty()) {
                            Text("Auto-Captions Track (Tap to style)", color = Color(0xFFFFD600), fontSize = 10.sp)
                            Spacer(Modifier.height(4.dp))
                            Row(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .horizontalScroll(rememberScrollState()),
                                horizontalArrangement = Arrangement.spacedBy(6.dp)
                            ) {
                                uiState.captions.forEach { seg ->
                                    Box(
                                        modifier = Modifier
                                            .clip(RoundedCornerShape(6.dp))
                                            .background(Color(0xFF3E2723))
                                            .border(1.dp, Color(0xFFFFD600), RoundedCornerShape(6.dp))
                                            .clickable {
                                                exoPlayer.seekTo(seg.startMs)
                                                showCaptionsSheet = true
                                            }
                                            .padding(horizontal = 10.dp, vertical = 5.dp)
                                    ) {
                                        Text(
                                            text = "${seg.text} (${seg.startMs / 1000f}s)",
                                            color = Color(0xFFFFEB3B),
                                            fontSize = 11.sp,
                                            fontWeight = FontWeight.Bold
                                        )
                                    }
                                }
                            }
                            Spacer(Modifier.height(8.dp))
                        }

                        Text("Video Track", color = Color.Gray, fontSize = 10.sp)
                        Spacer(Modifier.height(4.dp))

                        Row(
                            modifier = Modifier
                                .fillMaxWidth()
                                .horizontalScroll(rememberScrollState()),
                            horizontalArrangement = Arrangement.spacedBy(8.dp)
                        ) {
                            uiState.clips.forEachIndexed { index, clip ->
                                val isSelected = index == uiState.selectedClipIndex
                                val durationSec = ((clip.endMs - clip.startMs) / 1000f).coerceAtLeast(0.5f)
                                val blockWidth = (durationSec * 28).dp.coerceIn(80.dp, 260.dp)

                                Box(
                                    modifier = Modifier
                                        .width(blockWidth)
                                        .height(52.dp)
                                        .clip(RoundedCornerShape(8.dp))
                                        .background(if (isSelected) Color(0xFF263238) else Color(0xFF1E1E24))
                                        .border(
                                            width = if (isSelected) 2.dp else 1.dp,
                                            color = if (isSelected) Color(0xFF00E5FF) else Color.DarkGray,
                                            shape = RoundedCornerShape(8.dp)
                                        )
                                        .clickable { viewModel.selectClip(index, exoPlayer) }
                                        .padding(8.dp)
                                ) {
                                    Column {
                                        Text(
                                            text = "${clip.name} (${clip.speed}x)",
                                            color = Color.White,
                                            fontSize = 12.sp,
                                            fontWeight = FontWeight.SemiBold
                                        )
                                        Text(
                                            text = "${clip.startMs / 1000f}s - ${clip.endMs / 1000f}s",
                                            color = Color(0xFF00E5FF),
                                            fontSize = 10.sp
                                        )
                                    }
                                }
                            }
                        }

                        val selectedClip = uiState.clips.getOrNull(uiState.selectedClipIndex)
                        if (selectedClip != null) {
                            Spacer(Modifier.height(6.dp))
                            Row(horizontalArrangement = Arrangement.spacedBy(16.dp)) {
                                Text("Trim Start +0.5s", color = Color.Cyan, fontSize = 11.sp,
                                    modifier = Modifier.clickable {
                                        viewModel.trimSelectedClip(selectedClip.startMs + 500L, selectedClip.endMs, exoPlayer)
                                    }
                                )
                                Text("Trim End -0.5s", color = Color.Cyan, fontSize = 11.sp,
                                    modifier = Modifier.clickable {
                                        viewModel.trimSelectedClip(selectedClip.startMs, selectedClip.endMs - 500L, exoPlayer)
                                    }
                                )
                            }
                        }
                    }

                    Row(
                        modifier = Modifier
                            .fillMaxWidth()
                            .background(Color(0xFF1A1A20))
                            .padding(vertical = 10.dp, horizontal = 6.dp),
                        horizontalArrangement = Arrangement.SpaceEvenly
                    ) {
                        ToolDockButton("Auto Captions", Icons.Default.ClosedCaption) {
                            showCaptionsSheet = true
                        }
                        ToolDockButton("Split", Icons.Default.ContentCut) {
                            viewModel.splitSelectedClipAt(exoPlayer.currentPosition, exoPlayer)
                        }
                        ToolDockButton("Speed", Icons.Default.Speed) {
                            val clip = uiState.clips.getOrNull(uiState.selectedClipIndex)
                            val nextSpeed = if (clip?.speed == 1.0f) 2.0f else if (clip?.speed == 2.0f) 0.5f else 1.0f
                            viewModel.setPlaybackSpeed(nextSpeed, exoPlayer)
                        }
                        ToolDockButton("Filter: ${uiState.activeFilter.label}", Icons.Default.FilterVintage) {
                            val values = FilterPreset.entries
                            val next = values[(uiState.activeFilter.ordinal + 1) % values.size]
                            viewModel.setFilter(next, exoPlayer)
                        }
                        ToolDockButton("Rotate", Icons.Default.CropRotate) {
                            viewModel.rotateVideo(exoPlayer)
                        }
                        ToolDockButton("Delete", Icons.Default.Delete) {
                            viewModel.deleteSelectedClip(exoPlayer)
                        }
                    }
                }

                if (showCaptionsSheet) {
                    ModalBottomSheet(
                        onDismissRequest = { showCaptionsSheet = false },
                        containerColor = Color(0xFF18181E)
                    ) {
                        Column(
                            modifier = Modifier
                                .fillMaxWidth()
                                .padding(horizontal = 16.dp, vertical = 8.dp)
                        ) {
                            Text(
                                text = "Auto-Captions & Font Studio",
                                color = Color.White,
                                fontWeight = FontWeight.Bold,
                                fontSize = 18.sp
                            )
                            Spacer(Modifier.height(10.dp))

                            Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                                Button(
                                    onClick = {
                                        val intent = Intent(RecognizerIntent.ACTION_RECOGNIZE_SPEECH).apply {
                                            putExtra(RecognizerIntent.EXTRA_LANGUAGE_MODEL, RecognizerIntent.LANGUAGE_MODEL_FREE_FORM)
                                            putExtra(RecognizerIntent.EXTRA_LANGUAGE, Locale.getDefault())
                                            putExtra(RecognizerIntent.EXTRA_PROMPT, "Speak your video captions...")
                                        }
                                        try {
                                            voiceCaptionLauncher.launch(intent)
                                        } catch (e: Exception) {
                                            viewModel.generateSmartAutoCaptions(null, exoPlayer)
                                        }
                                    },
                                    colors = ButtonDefaults.buttonColors(containerColor = Color(0xFF00E5FF)),
                                    modifier = Modifier.weight(1f)
                                ) {
                                    Icon(Icons.Default.Mic, contentDescription = null, tint = Color.Black)
                                    Spacer(Modifier.width(4.dp))
                                    Text("Dictate by Voice", color = Color.Black, fontWeight = FontWeight.Bold)
                                }

                                OutlinedButton(
                                    onClick = {
                                        viewModel.generateSmartAutoCaptions(customTranscriptInput.ifBlank { null }, exoPlayer)
                                    },
                                    modifier = Modifier.weight(1f)
                                ) {
                                    Icon(Icons.Default.AutoAwesome, contentDescription = null)
                                    Spacer(Modifier.width(4.dp))
                                    Text("Auto-Generate")
                                }
                            }

                            Spacer(Modifier.height(8.dp))
                            OutlinedTextField(
                                value = customTranscriptInput,
                                onValueChange = { customTranscriptInput = it },
                                label = { Text("Or paste/type script to auto-time into 3-word chunks") },
                                modifier = Modifier.fillMaxWidth(),
                                singleLine = true
                            )

                            Spacer(Modifier.height(14.dp))
                            Text("Caption Style Templates", color = Color.LightGray, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                            Spacer(Modifier.height(6.dp))

                            Row(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .horizontalScroll(rememberScrollState()),
                                horizontalArrangement = Arrangement.spacedBy(8.dp)
                            ) {
                                CaptionStylePreset.entries.forEach { preset ->
                                    val selected = uiState.selectedCaptionStyle == preset
                                    FilterChip(
                                        selected = selected,
                                        onClick = { viewModel.updateCaptionStyle(preset, exoPlayer) },
                                        label = { Text(preset.label) }
                                    )
                                }
                            }

                            Spacer(Modifier.height(10.dp))
                            Text("Font Family", color = Color.LightGray, fontSize = 13.sp, fontWeight = FontWeight.SemiBold)
                            Spacer(Modifier.height(6.dp))

                            Row(
                                modifier = Modifier
                                    .fillMaxWidth()
                                    .horizontalScroll(rememberScrollState()),
                                horizontalArrangement = Arrangement.spacedBy(8.dp)
                            ) {
                                CaptionFontFamily.entries.forEach { font ->
                                    val selected = uiState.selectedCaptionFont == font
                                    FilterChip(
                                        selected = selected,
                                        onClick = { viewModel.updateCaptionFont(font, exoPlayer) },
                                        label = {
                                            Text(
                                                text = font.label,
                                                fontFamily = when (font) {
                                                    CaptionFontFamily.SANS_BOLD -> FontFamily.SansSerif
                                                    CaptionFontFamily.SERIF -> FontFamily.Serif
                                                    CaptionFontFamily.MONOSPACE -> FontFamily.Monospace
                                                    CaptionFontFamily.CURSIVE -> FontFamily.Cursive
                                                }
                                            )
                                        }
                                    )
                                }
                            }

                            Spacer(Modifier.height(12.dp))
                            Row(
                                modifier = Modifier.fillMaxWidth(),
                                horizontalArrangement = Arrangement.SpaceBetween
                            ) {
                                TextButton(onClick = { viewModel.cycleCaptionPosition(exoPlayer) }) {
                                    Icon(Icons.Default.SwapVert, contentDescription = null)
                                    Spacer(Modifier.width(4.dp))
                                    Text("Position (Bottom / Center / Top)")
                                }

                                TextButton(onClick = { viewModel.clearCaptions(exoPlayer) }) {
                                    Text("Clear All", color = Color(0xFFFF5252))
                                }
                            }
                            Spacer(Modifier.height(20.dp))
                        }
                    }
                }
            }

            @Composable
            fun ToolDockButton(label: String, icon: androidx.compose.ui.graphics.vector.ImageVector, onClick: () -> Unit) {
                Column(
                    horizontalAlignment = Alignment.CenterHorizontally,
                    modifier = Modifier
                        .clickable(onClick = onClick)
                        .padding(horizontal = 6.dp)
                ) {
                    Icon(icon, contentDescription = label, tint = Color.White, modifier = Modifier.size(22.dp))
                    Spacer(Modifier.height(4.dp))
                    Text(label, color = Color.LightGray, fontSize = 10.sp)
                }
            }
            EOF

            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add settings.gradle.kts build.gradle.kts gradle.properties app/
            git commit -m "Auto-save Android project files with Auto-Captions [skip ci]"
            git push
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Compile Android Debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload Ready-to-Install APK
        uses: actions/upload-artifact@v4
        with:
          name: CapCut-Native-APK
          path: app/build/outputs/apk/debug/app-debug.apk
