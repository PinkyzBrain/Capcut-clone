name: Build CapCut APK & Save Project Files

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate Project Files (only if not saved in repo yet)
        run: |
          if [ ! -f "settings.gradle.kts" ]; then
            mkdir -p app/src/main/java/com/example/capcutclone
            cat << 'EOF' > settings.gradle.kts
            pluginManagement {
                repositories {
                    google()
                    mavenCentral()
                    gradlePluginPortal()
                }
            }
            dependencyResolutionManagement {
                repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
                repositories {
                    google()
                    mavenCentral()
                }
            }
            rootProject.name = "CapCutClone"
            include(":app")
            EOF

            cat << 'EOF' > app/build.gradle.kts
            plugins {
                alias(libs.plugins.android.application) apply false
                alias(libs.plugins.jetbrains.kotlin.android) apply false
                alias(libs.plugins.jetbrains.kotlin.compose) apply false
            }
            EOF

            cat << 'EOF' > gradle.properties
            org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
            android.useAndroidX=true
            android.nonTransitiveRClass=true
            EOF

            cat << 'EOF' > app/build.gradle.kts
            plugins {
                alias(libs.plugins.android.application)
                alias(libs.plugins.jetbrains.kotlin.android)
                alias(libs.plugins.jetbrains.kotlin.compose)
            }

            android {
                namespace = "com.example.capcutclone"
                compileSdk = 35

                defaultConfig {
                    applicationId = "com.example.capcutclone"
                    minSdk = 26
                    targetSdk = 35
                    versionCode = 2
                    versionName = "1.1"
                }

                buildFeatures {
                    compose = true
                }

                compileOptions {
                    sourceCompatibility = JavaVersion.VERSION_17
                    targetCompatibility = JavaVersion.VERSION_17
                }
                kotlinOptions {
                    jvmTarget = "17"
                }
            }
            EOF
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Commit Generated Project Files
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add settings.gradle.kts gradle.properties app/build.gradle.kts
          if git diff --staged --quiet; then
            echo "No new project files to commit."
          else
            git commit -m "Auto-generate core Android project files [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
          
